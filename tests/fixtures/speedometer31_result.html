<!--
  Structure captured from WebKit/Speedometer branch release/3.1 (index.html
  section#summary). Values stand in for a completed run and are written into
  #result-number / #confidence-number exactly as resources/main.mjs does:
  textContent = scoreResults.formattedMean / "± formattedDelta".
-->
<section id="summary" data-title="Results Summary" class="valid">
    <a href="#home" class="logo">
        <div class="version next">3.1</div>
    </a>
    <h1>Score</h1>
    <div class="gauge">
        <div class="window"><div class="needle"></div></div>
    </div>
    <hr />
    <div id="result-number">38.42</div>
    <div id="confidence-number">± 0.71</div>
    <div id="invalid-score-text">
        One or more subtests produced no duration.<br />
    </div>
</section>
